<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收藏到 Paul 素材库</title>
  <link rel="stylesheet" href="capture.css" />
  <script src="capture.js" defer></script>
</head>
<body>
  <main>
    <header class="capture-heading">
      <svg class="library-mark" width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect width="28" height="28" rx="8" fill="currentColor"/><path d="m6 11 8-4 8 4-8 4-8-4Zm0 4 8 4 8-4m-16 4 8 4 8-4" stroke="var(--accent-ink)" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <h1 id="heading">收藏图片</h1><span class="product-name">Paul 素材库</span>
    </header>
    <p id="hint" hidden>用左键拖动网页图片或正在播放的视频画面，松手打开收藏框。也可从视频右键菜单抓取当前帧。</p>
    <figure id="preview" hidden>
      <img id="frame" alt="待收藏的画面" />
      <figcaption id="frame-details" hidden></figcaption>
    </figure>
    <form id="capture" hidden>
      <div class="source-row">
        <span>来源网页</span>
        <a id="source" target="_blank" rel="noreferrer noopener"></a>
      </div>
      <div class="field">
        <label for="name">素材名称</label>
        <input id="name" required maxlength="60" />
      </div>
      <div class="field">
        <label for="folder">目标文件夹</label>
        <select id="folder"><option value="">未归类</option></select>
      </div>
      <div class="field">
        <label for="tags">标签</label>
        <div class="tag-input">
          <input id="tags" list="known-tags" placeholder="选择或输入标签" autocomplete="off" maxlength="160" />
          <button id="add-tag" type="button">添加</button>
        </div>
        <datalist id="known-tags"></datalist>
        <div id="chosen-tags" class="chosen-tags" aria-label="已选标签"></div>
      </div>
      <div class="actions">
        <button id="save" type="submit" class="primary">收藏</button>
        <a id="open-library" target="_blank" rel="noreferrer noopener" hidden>打开素材库</a>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
